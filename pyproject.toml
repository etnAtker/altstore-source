[project]
name = "altstore-source"
version = "0.1.0"
description = "Generate an AltStore source JSON from GitHub release IPA assets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0.2",
    "requests>=2.32.0",
]

[project.scripts]
altstore-source = "altstore_source.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
