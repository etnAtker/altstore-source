name: Update AltStore Source

on:
  workflow_dispatch:
    inputs:
      app:
        description: Only update one app id. Leave empty to update all apps.
        required: false
        type: string
      force:
        description: Reserved for future cache invalidation.
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */6 * * *"
  push:
    paths:
      - "config.yml"
      - "pyproject.toml"
      - "scripts/**"
      - "src/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Generate source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=()
          if [ -n "${{ github.event.inputs.app }}" ]; then
            args+=(--app "${{ github.event.inputs.app }}")
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            args+=(--force)
          fi
          uv run python -m altstore_source "${args[@]}"

      - name: Commit changes
        run: |
          if git diff --quiet -- dist/apps.json; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/apps.json
          git commit -m "chore: 更新 AltStore source"
          git push
